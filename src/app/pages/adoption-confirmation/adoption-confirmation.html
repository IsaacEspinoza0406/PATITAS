<div class="confirmation-container">
  <div class="confirmation-card">
    <h1 class="confirmation-title">¡Tu camino hacia un nuevo amigo comienza aquí!</h1>
    
    <p class="confirmation-message">
      Gracias por tu interés en adoptar. Hemos recibido tu solicitud y nuestro equipo 
      la revisará cuidadosamente. Nos pondremos en contacto contigo pronto para los 
      siguientes pasos del proceso de adopción.
    </p>

    <div class="dog-image-container">
      <img src="assets/img/golden-happy.png" alt="Perrito feliz" class="dog-image">
    </div>

    <div class="button-group">
      <button class="btn-secondary" (click)="goToDogCatalog()">
        Ver más perritos
      </button>
      <button class="btn-primary" (click)="goToHome()">
        Volver al inicio
      </button>
    </div>
  </div>
</div>
