<div class="admin-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="profile-icon">
        <span class="profile-icon-placeholder">👤</span>
      </div>
      <button class="menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li><a href="#" class="nav-link">Solicitudes de Adopción</a></li>
        <li><a href="#" class="nav-link active">Catálogo</a></li>

      </ul>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <h1 class="page-title">Catálogo</h1>

    <div class="pets-grid">
      <div *ngFor="let pet of pets" class="pet-card">
        <div class="pet-image-container">
          <img *ngIf="pet.photos && pet.photos.length > 0" [src]="pet.photos[0].photoUrl" alt="{{ pet.name }}"
            class="pet-image">
          <div *ngIf="!pet.photos || pet.photos.length === 0" class="pet-image-placeholder"></div>
        </div>

        <div class="pet-info">
          <div class="pet-details">
            <p class="pet-label">Nombre(s):</p>
            <p class="pet-value">{{ pet.name }}</p>
            <p class="pet-label">Edad:</p>
            <p class="pet-value">{{ pet.age || '---' }}</p>
          </div>

          <div class="pet-actions">
            <button type="button" class="btn-edit" (click)="editPet(pet)">
              Editar
            </button>
            <button type="button" class="btn-delete" (click)="deletePet(pet)">
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
