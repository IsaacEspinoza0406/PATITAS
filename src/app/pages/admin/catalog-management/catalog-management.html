<div class="admin-container">
    <aside class="sidebar">
    <div class="sidebar-header">
      <div class="profile-icon">
        <img src="https://placehold.co/50x50/333/fff?text=A" alt="Admin">
      </div>
      <div class="admin-info">
        <span class="admin-name">{{ adminName }}</span>
        <span class="admin-role">Administrador</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li>
          <a routerLink="/admin/adoption-request" routerLinkActive="active-link">
            Solicitudes de Adopción
          </a>
        </li>
        <li>
          <a routerLink="/admin/catalog" routerLinkActive="active-link">
            Catálogo
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Contenido principal. -->
  <main class="content">
    
    <div class="content-header">
      <h2>Gestión de Catálogo</h2>
      <a routerLink="/admin/add-dog" class="btn-add-new">
        + Agregar Nuevo
      </a>
    </div>

    <div *ngIf="isLoading" class="loading">
      <p>Cargando perritos...</p>
    </div>

    <!--Aquí están las tarjetas. -->
    <div class="catalog-grid" *ngIf="!isLoading">
      
      <div class="dog-card-admin" *ngFor="let dog of dogs">
        <div class="card-image">
          <img 
            *ngIf="dog.photos && dog.photos.length > 0" 
            [src]="dog.photos[0].photoUrl" 
            [alt]="dog.name">
          
          <img 
            *ngIf="!dog.photos || dog.photos.length === 0" 
            src="https://placehold.co/300x200/333/fff?text=Sin+Foto" 
            alt="Sin foto">
        </div>
        
        <div class="card-details">
          <p class="dog-name">Nombre: <strong>{{ dog.name }}</strong></p>
          <p class="dog-age">Edad: <span>{{ dog.age }} años</span></p>
          <p class="dog-breed">Raza: <span>{{ dog.breed }}</span></p>
          
          <div class="card-actions">
            <button class="btn-edit" (click)="onEdit(dog.id)">Editar</button>
            <button class="btn-delete" (click)="onDelete(dog.id)">Eliminar</button>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>
