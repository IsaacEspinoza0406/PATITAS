<div class="contenedor-login">
  
  <div class="seccion-marca">
    <img src="assets/img/logo.png" alt="Logo Patitas Desamparadas" class="logo-marca">
  </div>

  <div class="seccion-formulario">
    
    <h2>INICIA SESIÓN</h2>

    <form (ngSubmit)="iniciarSesion(loginForm)" #loginForm="ngForm" novalidate>

      <div class="grupo-form">
        <label for="email">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          ngModel
          required
          email
          #email="ngModel"
          placeholder="ejemplo@dominio.com">
      </div>

      <div class="grupo-form">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          ngModel
          required
          #password="ngModel"
          placeholder="Ingresa tu contraseña">
      </div>

      <div class="grupo-form">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword"
          ngModel
          required
          #confirmPassword="ngModel"
          placeholder="Vuelve a escribir tu contraseña">
      </div>

      <button type="submit" class="btn-submit" [disabled]="!loginForm.valid">
        Iniciar Sesión
      </button>
    
      <p class="enlace-secundario">
        ¿No tienes una cuenta? <a href="/user-registration">Regístrate aquí</a>
      </p>
      
    </form>
  </div>

</div>
