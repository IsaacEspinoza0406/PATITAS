<div class="auth-container">
  <div class="auth-layout">

    <!--Izquierda: imagen. -->
    <div class="auth-image">
      <img src="../../../assets/img/login.png" alt="login">
    </div>

    <!--Derecha: formulario.-->
    <div class="auth-card">

      <!-- Inicia sesión -->
      <div class="form-wrapper">
        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
          <h2>INICIA SESIÓN</h2>

          <div class="form-group">
            <label for="loginEmail">Correo electrónico</label>
            <input type="email" id="loginEmail" name="loginEmail" [(ngModel)]="loginData.email" required email>
          </div>

          <div class="form-group">
            <label for="loginPassword">Contraseña</label>
            <input type="password" id="loginPassword" name="loginPassword" [(ngModel)]="loginData.password" required>
          </div>

          <button type="submit" class="auth-button" [disabled]="!loginForm.valid">Iniciar Sesión</button>
        </form>
      </div>
    </div>
  </div>
</div>
